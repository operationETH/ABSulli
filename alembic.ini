[alembic]
script_location = alembic
prepend_sys_path = .

# Fallback URL for direct manual Alembic CLI usage.
# During normal ABSulli startup, alembic/env.py overrides this value with
# settings.database_url from the app environment/configuration.
sqlalchemy.url = sqlite:////config/absulli.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
