{% extends "base.html" %}

{% block content %}
<section class="panel graphs-panel">
  <div class="panel-head graph-page-head">
    <h2>Graphs</h2>

    <form class="graph-controls" method="get" action="/graphs">
      <label class="graph-select-wrap">
        <select name="user" aria-label="Graph user" data-auto-submit>
          <option value="all" {{ 'selected' if selected_user == 'all' else '' }}>All users</option>
          {% for user in users %}
            <option value="{{ user.username }}" {{ 'selected' if selected_user == user.username else '' }}>{{ user.display_name or user.username }}</option>
          {% endfor %}
        </select>
      </label>

      <div class="button-row dashboard-button-row graph-button-row">
        <a class="tab-btn {{ 'active' if stat_metric == 'count' else '' }}" href="/graphs?metric=count&days={{ stat_days }}&user={{ selected_user }}">Play Count</a>
        <a class="tab-btn {{ 'active' if stat_metric == 'duration' else '' }}" href="/graphs?metric=duration&days={{ stat_days }}&user={{ selected_user }}">Play Duration</a>
        <span class="tab-btn tab-label">Last</span>
        <input type="hidden" name="metric" value="{{ stat_metric }}">
        <input class="tab-btn days-input" type="number" name="days" min="1" max="999" step="1" value="{{ stat_days }}" aria-label="Number of graph days">
        <button class="tab-btn days-submit" type="submit">Days</button>
      </div>
    </form>
  </div>

</section>

<script id="graphs-data" type="application/json" nonce="{{ request.state.absulli_csp_nonce | default('') }}">{{ graph_data.charts | tojson }}</script>

<section class="graphs-grid" data-graphs-root>
  {% for chart in graph_data.charts %}
    <article class="graph-card {{ 'wide' if chart.type == 'line' else '' }}{{ ' heatmap-card' if chart.type == 'heatmap' else '' }}">
      <div class="graph-card-head">
        <div>
          <h3>{{ chart.title }}</h3>
          <p>{{ chart.subtitle }}</p>
        </div>
      </div>
      <div class="graph-canvas-wrap">
        <canvas class="abs-graph" data-chart-index="{{ loop.index0 }}" height="260"></canvas>
      </div>
      <div class="graph-empty">No graph data yet.</div>
    </article>
  {% endfor %}
</section>
{% endblock %}
