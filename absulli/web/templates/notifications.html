{% extends "base.html" %}
{% block content %}
<section class="hero"><div><h1>Notifications</h1></div></section>
<section class="panel"><div class="panel-head"><h2>Notification Log</h2></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Time</th><th>Type</th><th>Title</th><th>Body</th><th>Delivered</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.created_at|local_datetime }}</td><td>{{ row.event_type }}</td><td>{{ row.title }}</td><td>{{ row.body }}</td><td><span class="badge {{ 'good' if row.delivered else 'warn' }}">{{ row.delivered }}</span></td></tr>{% else %}<tr><td colspan="5" class="empty">No notification events yet.</td></tr>{% endfor %}</tbody></table></div></section>
{% endblock %}
