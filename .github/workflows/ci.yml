name: Test ABSulli

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Check Ruff
        run: ruff check .

      - name: Run tests with coverage
        run: python -m pytest -q -p no:cacheprovider --cov=absulli --cov-report=term-missing --cov-fail-under=82

      - name: Run privileged entrypoint tests
        if: matrix.python-version == '3.14'
        run: sudo -E env "PATH=$PATH" python -m pytest -q -p no:cacheprovider tests/test_entrypoint.py

      - name: Audit Python dependencies
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt
