name: Promote ABSulli Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-absulli-release
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${MANUAL_VERSION#v}"
          else
            VERSION="${RELEASE_TAG#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use stable semantic version format: MAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Promote GHCR image
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/operationeth/absulli:latest \
            ghcr.io/operationeth/absulli:${{ steps.version.outputs.version }}

      - name: Promote Docker Hub image
        run: |
          docker buildx imagetools create \
            --tag operationeth/absulli:latest \
            operationeth/absulli:${{ steps.version.outputs.version }}
